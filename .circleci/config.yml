version: 2

jobs:
  build:
    docker:
      - image: cimg/node:24.22

    working_directory: ~/repo

    steps:
      - checkout
      # The image ships Yarn 1; corepack's shim for the Yarn 4 in package.json must replace it.
      - run: sudo corepack enable
      - restore_cache:
          keys:
            - v3-dependencies-{{ checksum "yarn.lock" }}
            - v3-dependencies-
      - run: yarn install --immutable
      - save_cache:
          paths:
            - node_modules
          key: v3-dependencies-{{ checksum "yarn.lock" }}

      # The build generates src/content/docs, which lint resolves imports against.
      - run: GATSBY_CPU_COUNT=1 yarn build
      - run: yarn lint
      - run: yarn format:check
      - run: yarn test
