enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# eslint-plugin-import, eslint-plugin-jsx-a11y and eslint-plugin-react run on ESLint 10 (the react
# plugin through @eslint/compat in eslint.config.mjs), but their peer ranges still stop at 9 and
# Yarn cannot widen an existing peer range. Drop that one warning until the plugins catch up.
logFilters:
  - pattern: 'eslint is listed by your project with version 10.*'
    level: discard
